[project]
name = "nba-draft-bot"
version = "0.1.0"
description = "Discord blind-auction NBA draft bot with an LLM-simulated tournament finale"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "anthropic>=0.60",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["draftbot"]
